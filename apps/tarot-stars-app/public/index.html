<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Tarot Stars - Your Daily Tarot Reading Telegram Mini App"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      // Only load Telegram Web App SDK if we're in a Telegram environment
      if (window.location.search.includes('tgWebAppPlatform') || 
          window.location.hostname !== 'localhost') {
        const script = document.createElement('script');
        script.src = 'https://telegram.org/js/telegram-web-app.js';
        script.onerror = function() {
          console.log('Telegram Web App SDK failed to load');
        };
        document.head.appendChild(script);
      } else {
        console.log('Development mode: Telegram Web App SDK not loaded - will show guide page');
        // Don't create mock Telegram object to properly test guide page
      }
    </script>
    <title>Tarot Stars - Telegram Mini App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
